name: CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-dev libglib2.0-dev libegl1 libgl1 dbus

      - name: Install Project & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" PySide6 bleak dbus-python

      - name: Run Test Suite
        run: |
          pytest -q
